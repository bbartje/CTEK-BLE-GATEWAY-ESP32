name: Controleer ESP32-firmware
on:
  workflow_dispatch:
  push:
    paths: ['firmware/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'docs/**', 'package.json', 'package-lock.json', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - run: npm ci
      - run: python3 firmware/tools/build_release.py --output /tmp/ctek-release/0.2.0-beta.3
      - run: npm run build
      - run: npm test
      - run: python3 firmware/tools/test_release.py --release /tmp/ctek-release/0.2.0-beta.3
      - uses: actions/upload-artifact@v4
        with:
          name: ctek-esp32-wroom-32-flashpakket
          path: /tmp/ctek-release/*.zip
