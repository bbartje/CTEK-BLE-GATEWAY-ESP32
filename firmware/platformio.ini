[platformio]
default_envs = esp32-wroom-32

[env:esp32-wroom-32]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@4.20017.260907+sha.dcc1105b
    platformio/tool-esptoolpy@2.41100.260830
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.app_partition_name = ota_0
monitor_speed = 115200
build_unflags = -std=gnu++11
extra_scripts = pre:tools/build_metadata.py
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    knolleary/PubSubClient@2.8.0
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -std=gnu++17
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -D CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=23
    -D CONFIG_BT_NIMBLE_LOG_LEVEL=0
    -D CONFIG_BT_NIMBLE_PINNED_TO_CORE=1
    -D CONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
